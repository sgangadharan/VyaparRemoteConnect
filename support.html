<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Support Agent - Remote Assist</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 20px;
      }

      video {
        max-width: 100%;
        width: 800px;
        border: 2px solid #333;
        border-radius: 8px;
        background: #000;
        /* IMPORTANT: preserve aspect ratio (black bars may appear) */
        object-fit: contain;
        display: block;
        touch-action: none; /* prevent browser gestures interfering with pointer events */
        user-select: none;
      }

      .info {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Support Agent Console</h1>

    <div class="info">
      <div>
        Session Key:
        <input
          id="agentSessionInput"
          type="text"
          placeholder="Enter session key (e.g. customer-123)"
          style="width: 200px;"
        />
        <button id="joinSessionBtn">Join Session</button>
      </div>
      <small>
        Open this page and join the correct session key before the customer clicks
        “Start Remote Assist”.
      </small>
    </div>

    <video id="remoteVideo" autoplay playsinline muted></video>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      // Dynamic session ID, set after Join Session
      let sessionId = null;
      let sessionActive = false;

      const socket = io(); // or io('http://135.13.10.157:4000');

      // NOTE: You currently create pc once. If you want multiple sessions without reload,
      // you should recreate pc on every join. Keeping your structure for now.
      const pc = new RTCPeerConnection({
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "turn:global.relay.metered.ca:80", username: "openai", credential: "openai" },
          { urls: "turn:global.relay.metered.ca:443", username: "openai", credential: "openai" },
          { urls: "turn:global.relay.metered.ca:443?transport=tcp", username: "openai", credential: "openai" }
        ]
      });

      // appWidth/appHeight MUST represent the SAME coordinate system the client expects.
      // In your current design, client sends these via 'app-dimensions' and uses them for mapping.
      let appWidth = 800;
      let appHeight = 600;

      const video = document.getElementById("remoteVideo");

      socket.on("connect", () => {
        console.log("AGENT: connected to signaling server, id =", socket.id);
        console.log("AGENT: waiting for session key before joining a room");
      });

      function joinSession() {
        const key = document.getElementById("agentSessionInput").value.trim();
        if (!key) {
          alert("Please enter a Session Key to join.");
          return;
        }
        sessionId = key;
        sessionActive = true;
        console.log("AGENT: joining session", sessionId);
        socket.emit("register", { role: "agent", sessionId });
      }

      document.getElementById("joinSessionBtn").addEventListener("click", joinSession);

      // Dimensions from customer
      socket.on("app-dimensions", ({ width, height }) => {
        appWidth = width;
        appHeight = height;
        console.log("AGENT: app-dimensions from customer:", appWidth, appHeight);
      });

      // WebRTC: ICE + offer/answer
      pc.onicecandidate = (event) => {
        if (!event.candidate) return;
        if (!sessionId) {
          console.warn("AGENT: ICE candidate but no sessionId yet, ignoring");
          return;
        }
        socket.emit("ice-candidate", { sessionId, candidate: event.candidate });
      };

      socket.on("offer", async ({ offer }) => {
        console.log("AGENT: received OFFER");
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          if (!sessionId) {
            console.warn("AGENT: got offer but no sessionId yet, ANSWER will not be routed correctly");
            return;
          }
          socket.emit("answer", { sessionId, answer });
        } catch (e) {
          console.error("AGENT: error handling offer:", e);
        }
      });

      socket.on("ice-candidate", async ({ candidate }) => {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {
          console.error("AGENT: error adding ICE candidate:", e);
        }
      });

      socket.on("session-ended", ({ sessionId: endedId, reason }) => {
        console.log("AGENT: session ended by client:", endedId, reason);
        sessionActive = false;

        try {
          if (pc) {
            pc.getSenders().forEach((s) => pc.removeTrack(s));
            pc.close();
          }
        } catch (e) {
          console.error("AGENT: error closing peer connection after session end", e);
        }

        video.srcObject = null;

        alert("Remote session was stopped by the customer. This page will now refresh.");
        window.location.reload();
      });

      // Attach remote stream
      pc.ontrack = (event) => {
        console.log("AGENT: ontrack fired, attaching stream to video");
        const [stream] = event.streams;
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          console.log(
            "AGENT: video metadata loaded, videoWidth=",
            video.videoWidth,
            "videoHeight=",
            video.videoHeight
          );

          // Optional safety: if customer didn't send app-dimensions yet,
          // we can temporarily use actual video dimensions.
          if (!appWidth || !appHeight) {
            appWidth = video.videoWidth || appWidth;
            appHeight = video.videoHeight || appHeight;
          }

          const playPromise = video.play();
          if (playPromise && typeof playPromise.then === "function") {
            playPromise.catch((err) => console.error("AGENT: video play() blocked/failed:", err));
          }
        };
      };

      // -------------------------------------------------------
      // Correct mapping: pointer position -> DRAWN VIDEO REGION
      // (handles letterboxing/pillarboxing from object-fit:contain)
      // -------------------------------------------------------
      function mapToAppCoords(evt) {
        if (!video.videoWidth || !video.videoHeight) return null;

        const rect = video.getBoundingClientRect();
        const elementW = rect.width;
        const elementH = rect.height;

        const videoAR = video.videoWidth / video.videoHeight;
        const elementAR = elementW / elementH;

        let drawW, drawH, offsetX, offsetY;

        if (elementAR > videoAR) {
          // element is wider than video: vertical fit, bars on left/right
          drawH = elementH;
          drawW = drawH * videoAR;
          offsetX = (elementW - drawW) / 2;
          offsetY = 0;
        } else {
          // element is taller than video: horizontal fit, bars top/bottom
          drawW = elementW;
          drawH = drawW / videoAR;
          offsetX = 0;
          offsetY = (elementH - drawH) / 2;
        }

        const xInEl = evt.clientX - rect.left;
        const yInEl = evt.clientY - rect.top;

        const xInDraw = xInEl - offsetX;
        const yInDraw = yInEl - offsetY;

        // If pointer is in the black bars, ignore (prevents drift)
        if (xInDraw < 0 || yInDraw < 0 || xInDraw > drawW || yInDraw > drawH) {
          return null;
        }

        const relX = xInDraw / drawW;
        const relY = yInDraw / drawH;

        // Scale into customer's coordinate system (appWidth/appHeight)
        const x = relX * appWidth;
        const y = relY * appHeight;

        return { x, y };
      }

      // -----------------------
      // Mouse MOVE (throttled)
      // -----------------------
      let lastMoveSent = 0;
      const MOVE_THROTTLE_MS = 16; // ~60fps

      video.addEventListener("mousemove", (evt) => {
        if (!sessionActive || !sessionId) return;
        if (!video.videoWidth || !video.videoHeight) return;

        const now = Date.now();
        if (now - lastMoveSent < MOVE_THROTTLE_MS) return;
        lastMoveSent = now;

        const pt = mapToAppCoords(evt);
        if (!pt) return;

        socket.emit("control-event", {
          sessionId,
          event: {
            type: "mouse",
            subtype: "mouseMove",
            x: pt.x,
            y: pt.y,
            button: "left"
          }
        });
      });

      // -----------------------
      // Mouse CLICK (pointerdown/up)
      // -----------------------
      video.addEventListener("pointerdown", (evt) => {
        if (!sessionActive || !sessionId) return;
        if (evt.button !== 0) return; // left click only

        // ensure video plays
        if (video.paused) {
          const playPromise = video.play();
          if (playPromise && typeof playPromise.then === "function") {
            playPromise.catch((err) => console.error("AGENT: video play() failed on pointerdown:", err));
          }
        }

        const pt = mapToAppCoords(evt);
        if (!pt) return;

        socket.emit("control-event", {
          sessionId,
          event: { type: "mouse", subtype: "mouseDown", x: pt.x, y: pt.y, button: "left" }
        });
      });

      video.addEventListener("pointerup", (evt) => {
        if (!sessionActive || !sessionId) return;
        if (evt.button !== 0) return;

        const pt = mapToAppCoords(evt);
        if (!pt) return;

        socket.emit("control-event", {
          sessionId,
          event: { type: "mouse", subtype: "mouseUp", x: pt.x, y: pt.y, button: "left" }
        });
      });

      // Prevent context menu interfering
      video.addEventListener("contextmenu", (e) => e.preventDefault());

      // -----------------------
      // Mouse WHEEL (scroll)
      // -----------------------
      video.addEventListener(
        "wheel",
        (evt) => {
          if (!sessionActive || !sessionId) return;
          evt.preventDefault();

          const pt = mapToAppCoords(evt);
          if (!pt) return;

          const STEP = 120;
          const deltaY = evt.deltaY > 0 ? STEP : evt.deltaY < 0 ? -STEP : 0;
          const deltaX = evt.deltaX > 0 ? STEP : evt.deltaX < 0 ? -STEP : 0;
          if (!deltaX && !deltaY) return;

          socket.emit("control-event", {
            sessionId,
            event: {
              type: "mouse",
              subtype: "mouseWheel",
              x: pt.x,
              y: pt.y,
              deltaX,
              deltaY
            }
          });
        },
        { passive: false }
      );

      // -----------------------
      // Keyboard forwarding
      // -----------------------
      window.addEventListener("keydown", (evt) => {
        if (!sessionActive || !sessionId) return;
        socket.emit("control-event", {
          sessionId,
          event: {
            type: "keyboard",
            subtype: "keyDown",
            key: evt.key,
            code: evt.code,
            altKey: evt.altKey,
            shiftKey: evt.shiftKey,
            ctrlKey: evt.ctrlKey,
            metaKey: evt.metaKey
          }
        });
        evt.preventDefault();
      });

      window.addEventListener("keyup", (evt) => {
        if (!sessionActive || !sessionId) return;
        socket.emit("control-event", {
          sessionId,
          event: {
            type: "keyboard",
            subtype: "keyUp",
            key: evt.key,
            code: evt.code,
            altKey: evt.altKey,
            shiftKey: evt.shiftKey,
            ctrlKey: evt.ctrlKey,
            metaKey: evt.metaKey
          }
        });
        evt.preventDefault();
      });
    </script>
  </body>
</html>
