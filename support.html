<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <title>Support Agent - Remote Assist</title>
  <style>
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 20px;
    }

      video {
        max-width: 100%;
        width: 800px;
        border: 2px solid #333;
      border-radius: 8px;
        background: #000;
        /* IMPORTANT: preserve aspect ratio (black bars may appear) */
        object-fit: contain;
        display: block;
        touch-action: none; /* prevent browser gestures interfering with pointer events */
        user-select: none;
      }

      #joinSessionBtn {
        background-color: #0066ff;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
      cursor: pointer;
        font-size: 14px;
    }

      #joinSessionBtn:disabled {
        background-color: #9bbcff;
        cursor: not-allowed;
        opacity: 0.8;
    }

      #leaveSessionBtn {
        background-color: #777;
        color: #ffffff;
      border: none;
        border-radius: 6px;
        padding: 6px 12px;
      cursor: pointer;
        font-size: 14px;
        margin-left: 8px;
      }

      #leaveSessionBtn:hover {
        background-color: #555;
      }

      #leaveSessionBtn:disabled {
        background-color: #c7c7c7;
        cursor: not-allowed;
        opacity: 0.8;
      }

      #connBadge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 10px;
      font-size: 12px;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid #ddd;
        background: #f7f7f7;
        user-select: none;
    }

      #connBadge::before {
        content: "";
        width: 8px;
        height: 8px;
      border-radius: 50%;
        display: inline-block;
        background: #9e9e9e;
      }

      #connBadge.connected {
        border-color: #b7e4c7;
        background: #f0fff4;
        color: #1b5e20;
      }

      #connBadge.connected::before {
        background: #2ecc71;
      }

      #connBadge.disconnected {
        border-color: #eee;
        background: #f7f7f7;
        color: #555;
      }

      #connBadge.disconnected::before {
        background: #9e9e9e;
      }

      .info {
        margin-bottom: 10px;
    }
  </style>
</head>

<body>
    <h1>Support Agent Console</h1>

    <div class="info">
      <div>
        Session Key:
        <input
          id="agentSessionInput"
          type="text"
          placeholder="Enter session key (e.g. customer-123)"
          style="width: 200px;"
        />
        <button id="joinSessionBtn">Join Session</button>
        <button id="leaveSessionBtn" disabled>Leave Session</button>
        <span id="connBadge" class="disconnected">Disconnected</span>
      </div>
      <small>
        Open this page and join the correct session key before the customer clicks
        “Start Remote Assist”.
      </small>
    </div>

    <video id="remoteVideo" autoplay playsinline muted></video>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
      // Dynamic session ID, set after Join Session
    let sessionId = null;
    let sessionActive = false;

    const socket = io(); // or io('http://135.13.10.157:4000');

      // Recreate PC per session so agent can Leave/Join without page reload
    let pc = null;

    function createPc() {
      const newPc = new RTCPeerConnection({
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "turn:global.relay.metered.ca:80", username: "openai", credential: "openai" },
          { urls: "turn:global.relay.metered.ca:443", username: "openai", credential: "openai" },
          { urls: "turn:global.relay.metered.ca:443?transport=tcp", username: "openai", credential: "openai" }
        ]
      });

      newPc.onicecandidate = (event) => {
        if (event.candidate && sessionId) {
          socket.emit("ice-candidate", { sessionId, candidate: event.candidate });
        }
      };

      newPc.ontrack = (event) => {
        const [stream] = event.streams;
        video.srcObject = stream;
        video.play().catch(() => {});
      };

      return newPc;
    }

    function createPeerConnection() {
      const newPc = new RTCPeerConnection({
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "turn:global.relay.metered.ca:80", username: "openai", credential: "openai" },
            { urls: "turn:global.relay.metered.ca:443", username: "openai", credential: "openai" },
            { urls: "turn:global.relay.metered.ca:443?transport=tcp", username: "openai", credential: "openai" }
          ]
      });

        // WebRTC: ICE candidate forwarding
      newPc.onicecandidate = (event) => {
          if (!event.candidate) return;
          if (!sessionId) {
            console.warn("AGENT: ICE candidate but no sessionId yet, ignoring");
            return;
          }
          socket.emit("ice-candidate", { sessionId, candidate: event.candidate });
        };

        // Attach remote stream
        newPc.ontrack = (event) => {
          console.log("AGENT: ontrack fired, attaching stream to video");
          const [stream] = event.streams;
          video.srcObject = stream;

          video.onloadedmetadata = () => {
            console.log(
              "AGENT: video metadata loaded, videoWidth=",
              video.videoWidth,
              "videoHeight=",
              video.videoHeight
            );

            // Optional safety: if customer didn't send app-dimensions yet,
            // we can temporarily use actual video dimensions.
            if (!appWidth || !appHeight) {
              appWidth = video.videoWidth || appWidth;
              appHeight = video.videoHeight || appHeight;
            }

            const playPromise = video.play();
            if (playPromise && typeof playPromise.then === "function") {
              playPromise.catch((err) => console.error("AGENT: video play() blocked/failed:", err));
            }
          };
      };

      return newPc;
    }

      // appWidth/appHeight MUST represent the SAME coordinate system the client expects.
      // In your current design, client sends these via 'app-dimensions' and uses them for mapping.
      let appWidth = 800;
      let appHeight = 600;

      const video = document.getElementById("remoteVideo");
      const joinBtn = document.getElementById("joinSessionBtn");
      const leaveBtn = document.getElementById("leaveSessionBtn");
      const connBadge = document.getElementById("connBadge");

      function setConnectionUI(connected) {
        if (!connBadge) return;
        if (connected) {
          connBadge.classList.remove("disconnected");
          connBadge.classList.add("connected");
          connBadge.textContent = "Connected";
        } else {
          connBadge.classList.remove("connected");
          connBadge.classList.add("disconnected");
          connBadge.textContent = "Disconnected";
    }
      }

      function closePeerConnection() {
        try {
          if (pc) {
            try { pc.getSenders().forEach((s) => pc.removeTrack(s)); } catch {}
            try { pc.close(); } catch {}
          }
        } finally {
          pc = null;
        }
        video.srcObject = null;
      }

      // Initial UI
      setConnectionUI(false);

      socket.on("connect", () => {
        console.log("AGENT: connected to signaling server, id =", socket.id);
        console.log("AGENT: waiting for session key before joining a room");
      });

      async function joinSession() {
        const key = document.getElementById("agentSessionInput").value.trim();
        if (!key) {
          alert("Please enter a Session Key to join.");
          return;
        }

        // If already in a session, do nothing
        if (sessionActive) return;

        // Must be connected to Socket.IO server
        if (!socket.connected) {
          alert("Not connected to server yet. Please wait a second and try again.");
          return;
        }

        // UI: show "joining..." state (but don't mark active yet)
        joinBtn.disabled = true;
        joinBtn.textContent = "Joining...";
        setConnectionUI(false);        // still disconnected until ACK
        leaveBtn.disabled = true;

        // Fresh PC for this session
        closePeerConnection();
        pc = createPeerConnection();

        try {
          // Register with ACK + timeout
          // Requires server register handler to accept (payload, ack)
          const ack = await socket.timeout(5000).emitWithAck("register", {
            role: "agent",
            sessionId: key
          });

          if (!ack || ack.ok !== true) {
            throw new Error(ack?.error || "register failed");
          }

          // Only now: session is truly active
          sessionId = key;
          sessionActive = true;

          console.log("AGENT: joined session", sessionId);

          joinBtn.disabled = true;
          joinBtn.textContent = "Session Active";
          leaveBtn.disabled = false;
          setConnectionUI(true);
        } catch (err) {
          console.error("AGENT: joinSession failed:", err);

          // Roll back state
          sessionId = null;
          sessionActive = false;

          // Cleanup pc so we don't keep a broken RTCPeerConnection around
          closePeerConnection();

          // Restore UI
          joinBtn.disabled = false;
          joinBtn.textContent = "Join Session";
          leaveBtn.disabled = true;
          setConnectionUI(false);

          alert("Join failed: " + (err?.message || String(err)));
        }
      }

      document.getElementById("joinSessionBtn").addEventListener("click", joinSession);

      function leaveSession() {
        if (!sessionActive) return;

        console.log("AGENT: leaving session", sessionId);

        // Stop sending events + reset session state
        sessionActive = false;
        sessionId = null;

        // Tear down media/pc
        closePeerConnection();

        // Reset UI
        joinBtn.disabled = false;
        joinBtn.textContent = "Join Session";
        leaveBtn.disabled = true;
        setConnectionUI(false);
    }

      leaveBtn.addEventListener("click", leaveSession);

      // Dimensions from customer
      socket.on("app-dimensions", ({ width, height }) => {
        appWidth = width;
        appHeight = height;
        console.log("AGENT: app-dimensions from customer:", appWidth, appHeight);
      });

      socket.on("offer", async ({ offer }) => {
        console.log("AGENT: received OFFER");
        if (!pc) {
          console.warn("AGENT: received offer but no active peer connection (did you leave the session?)");
          return;
        }
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          if (!sessionId) {
            console.warn("AGENT: got offer but no sessionId yet, ANSWER will not be routed correctly");
            return;
          }
          socket.emit("answer", { sessionId, answer });
        } catch (e) {
          console.error("AGENT: error handling offer:", e);
        }
      });

      socket.on("ice-candidate", async ({ candidate }) => {
        if (!pc) return;
        try {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {
          console.error("AGENT: error adding ICE candidate:", e);
        }
      });

      socket.on("session-ended", ({ sessionId: endedId, reason }) => {
        console.log("AGENT: session ended by client:", endedId, reason);

        // Cleanly leave without reloading
        if (typeof leaveSession === "function") {
          leaveSession();
        } else {
          // fallback
          sessionActive = false;
          sessionId = null;
          closePeerConnection();
          joinBtn.disabled = false;
          joinBtn.textContent = "Join Session";
          leaveBtn.disabled = true;
          setConnectionUI(false);
        }

        alert("Remote session was stopped by the customer.");
      });

      // -------------------------------------------------------
      // Correct mapping: pointer position -> DRAWN VIDEO REGION
      // (handles letterboxing/pillarboxing from object-fit:contain)
      // -------------------------------------------------------
      function mapToAppCoords(evt) {
        if (!video.videoWidth || !video.videoHeight) return null;

        const rect = video.getBoundingClientRect();
        const elementW = rect.width;
        const elementH = rect.height;

        const videoAR = video.videoWidth / video.videoHeight;
        const elementAR = elementW / elementH;

        let drawW, drawH, offsetX, offsetY;

        if (elementAR > videoAR) {
          // element is wider than video: vertical fit, bars on left/right
          drawH = elementH;
          drawW = drawH * videoAR;
          offsetX = (elementW - drawW) / 2;
          offsetY = 0;
        } else {
          // element is taller than video: horizontal fit, bars top/bottom
          drawW = elementW;
          drawH = drawW / videoAR;
          offsetX = 0;
          offsetY = (elementH - drawH) / 2;
        }

        const xInEl = evt.clientX - rect.left;
        const yInEl = evt.clientY - rect.top;

        const xInDraw = xInEl - offsetX;
        const yInDraw = yInEl - offsetY;

        // If pointer is in the black bars, ignore (prevents drift)
        if (xInDraw < 0 || yInDraw < 0 || xInDraw > drawW || yInDraw > drawH) {
          return null;
        }

        const relX = xInDraw / drawW;
        const relY = yInDraw / drawH;

        // Scale into customer's coordinate system (appWidth/appHeight)
        const x = relX * appWidth;
        const y = relY * appHeight;

        return { x, y };
      }

      // -----------------------
      // Mouse MOVE (throttled)
      // -----------------------
      let lastMoveSent = 0;
      const MOVE_THROTTLE_MS = 16; // ~60fps

      video.addEventListener("mousemove", (evt) => {
        if (!sessionActive || !sessionId || !pc) return;
        if (!video.videoWidth || !video.videoHeight) return;

        const now = Date.now();
        if (now - lastMoveSent < MOVE_THROTTLE_MS) return;
        lastMoveSent = now;

        const pt = mapToAppCoords(evt);
        if (!pt) return;

        socket.emit("control-event", {
          sessionId,
          event: {
            type: "mouse",
            subtype: "mouseMove",
            x: pt.x,
            y: pt.y,
            button: "left"
          }
        });
    });

      // -----------------------
      // Mouse CLICK (pointerdown/up)
      // -----------------------
      video.addEventListener("pointerdown", (evt) => {
        if (!sessionActive || !sessionId || !pc) return;
        if (evt.button !== 0) return; // left click only

        // ensure video plays
        if (video.paused) {
          const playPromise = video.play();
          if (playPromise && typeof playPromise.then === "function") {
            playPromise.catch((err) => console.error("AGENT: video play() failed on pointerdown:", err));
          }
        }

        const pt = mapToAppCoords(evt);
        if (!pt) return;

        socket.emit("control-event", {
          sessionId,
          event: { type: "mouse", subtype: "mouseDown", x: pt.x, y: pt.y, button: "left" }
        });
      });

      video.addEventListener("pointerup", (evt) => {
        if (!sessionActive || !sessionId || !pc) return;
        if (evt.button !== 0) return;

        const pt = mapToAppCoords(evt);
        if (!pt) return;

        socket.emit("control-event", {
          sessionId,
          event: { type: "mouse", subtype: "mouseUp", x: pt.x, y: pt.y, button: "left" }
        });
      });

      // Prevent context menu interfering
      video.addEventListener("contextmenu", (e) => e.preventDefault());

      // -----------------------
      // Mouse WHEEL (scroll)
      // -----------------------
      video.addEventListener(
        "wheel",
        (evt) => {
          if (!sessionActive || !sessionId || !pc) return;
          evt.preventDefault();

          const pt = mapToAppCoords(evt);
          if (!pt) return;

          const STEP = 120;
          const deltaY = evt.deltaY > 0 ? STEP : evt.deltaY < 0 ? -STEP : 0;
          const deltaX = evt.deltaX > 0 ? STEP : evt.deltaX < 0 ? -STEP : 0;
          if (!deltaX && !deltaY) return;

          socket.emit("control-event", {
            sessionId,
            event: {
              type: "mouse",
              subtype: "mouseWheel",
              x: pt.x,
              y: pt.y,
              deltaX,
              deltaY
            }
          });
        },
        { passive: false }
      );

      // -----------------------
      // Keyboard forwarding
      // -----------------------
      window.addEventListener("keydown", (evt) => {
        if (!sessionActive || !sessionId || !pc) return;
        socket.emit("control-event", {
          sessionId,
          event: {
            type: "keyboard",
            subtype: "keyDown",
            key: evt.key,
            code: evt.code,
            altKey: evt.altKey,
            shiftKey: evt.shiftKey,
            ctrlKey: evt.ctrlKey,
            metaKey: evt.metaKey
          }
        });
        evt.preventDefault();
      });

      window.addEventListener("keyup", (evt) => {
        if (!sessionActive || !sessionId || !pc) return;
        socket.emit("control-event", {
          sessionId,
          event: {
            type: "keyboard",
            subtype: "keyUp",
            key: evt.key,
            code: evt.code,
            altKey: evt.altKey,
            shiftKey: evt.shiftKey,
            ctrlKey: evt.ctrlKey,
            metaKey: evt.metaKey
          }
        });
        evt.preventDefault();
      });
  </script>
</body>
</html>
